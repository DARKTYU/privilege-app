name: privilege
description: Privilege - Eat well, stay well. Flutter port of the Privilege Interactive Fitness Ecosystem.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_timezone: ^5.1.1
  http: ^1.2.0
  image_picker: ^1.1.2
  shared_preferences: ^2.2.3
  supabase_flutter: ^2.18.3

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/images/logo_launcher_1024.png
  adaptive_icon_background: "#0B0D12"
  adaptive_icon_foreground: assets/images/logo_launcher_foreground_1024.png
  min_sdk_android: 21
  web:
    generate: true
    image_path: assets/images/logo_launcher_1024.png
    background_color: "#0B0D12"
    theme_color: "#0B0D12"
  windows:
    generate: true
    image_path: assets/images/logo_launcher_1024.png
    icon_size: 256
  macos:
    generate: true
    image_path: assets/images/logo_launcher_1024.png

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/logo.png
    - assets/images/recipes/
    - assets/data/foods.json
