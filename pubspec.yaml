publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_timezone: ^5.1.1
  http: ^1.2.0
  image_picker: ^1.1.2
